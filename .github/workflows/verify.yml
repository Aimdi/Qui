name: verify

# The build in ci.yml proves the app compiles. This proves it is *correct*:
# formatting, static analysis, unit tests and ARB integrity, on every pull
# request rather than only after a push to master.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arb:
    name: ARB integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No Flutter needed, so this reports broken translations in seconds even
      # when the Dart job is still warming up.
      - name: Validate ARB files
        run: python scripts/validate_arb.py

  dart:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # lib/generated and lib/oss_licenses.dart are gitignored, so analysis
      # would drown in missing-import errors without generating them first.
      - name: Generate sources
        run: |
          dart run dart_pubspec_licenses:generate
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material

      # Reuse the exact SDK installed above; FVM still checks .fvmrc for every
      # invocation in the shared local/CI verification script.
      - name: Configure FVM for the pinned SDK
        run: |
          export PATH="$HOME/.pub-cache/bin:$PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          dart pub global activate fvm 4.3.1
          fvm config --cache-path "$RUNNER_TEMP/qui-fvm"
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          mkdir -p "$RUNNER_TEMP/qui-fvm/versions"
          ln -s "$FLUTTER_ROOT" "$RUNNER_TEMP/qui-fvm/versions/$version"

      - name: Verify
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          VERIFY_BASE_REF="origin/$BASE" bash scripts/verify.sh
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
